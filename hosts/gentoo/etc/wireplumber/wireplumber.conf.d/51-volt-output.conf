monitor.alsa.rules = [
    {
        matches = [
            { node.name = "alsa_output.usb-Universal_Audio_Volt_1_24232036072027-00.analog-stereo" }
        ]
        actions = {
            update-props = {
                # The Volt carries 24 valid PCM bits in a 32-bit container.
                audio.format = "S32LE"
                audio.allowed-rates = [ 44100 48000 88200 96000 176400 192000 ]
                channelmix.normalize = false
                channelmix.upmix = false
                dither.method = "none"
                dither.noise = 0
            }
        }
    }
]
