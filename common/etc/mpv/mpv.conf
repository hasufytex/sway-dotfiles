# Keep playback at unity gain; use the Volt interface's physical volume knob.
volume=100
replaygain=no
replaygain-preamp=0
replaygain-fallback=0
audio-normalize-downmix=no
# No EQ, compressor, or loudness-normalization audio filters.
af=

# Keep smaller videos at native resolution, with black borders in fullscreen.
# Still shrink videos that are larger than the window or screen.
video-unscaled=downscale-big

# Render on the GPU and enable hardware decoding for supported videos.
vo=gpu-next
gpu-api=vulkan
hwdec=auto
