# Opt-in Sunshine game-stream host (for Moonlight). Not loaded by default.
# Enable for your user with:
#   mkdir -p ~/.config/sway/config.d
#   ln -s /usr/local/share/sway-dotfiles/sunshine.conf ~/.config/sway/config.d/
#
# Only one user should enable this: Sunshine's ports can be bound once.

# Restart Sunshine if it exits: it crashes when the monitor is switched off.
# Only one copy runs per user (PID-file guard), and the loop ends once this
# sway session is gone, so logging in again doesn't leave an orphaned loop.
exec sunshine-session

# Virtual display so Sunshine still has something to stream when the monitor
# is off. sway-headless-fallback enables it only while no real output is
# active, so there is always exactly one screen.
output HEADLESS-1 mode 2560x1440@60Hz position 0 0
exec sway-headless-fallback
